kind = "web"
previewPath = "/"
title = "UPTIME - منصة أمن الشبكات"
version = "1.0.0"
id = "artifacts/uptime"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25031

[services.development]
run = "pnpm --filter @workspace/uptime run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uptime", "run", "build" ]
publicDir = "artifacts/uptime/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25031"
BASE_PATH = "/"
